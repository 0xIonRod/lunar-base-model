# Griffin-1 terrain inputs
#
# These entries are raw, download-only sources. NOBILE03 is a PDS3-labelled
# polar-stereographic DTM, while the native lunco-assets DEM cropper currently
# accepts equirectangular products only. Use tools/terrain/
# reproject_lroc_polar_dem.py after downloading both entries.

[nobile03_dem]
name = "LROC NAC DTM NOBILE03 (4 m/pixel polar-stereographic DEM)"
