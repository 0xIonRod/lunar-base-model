# Griffin-1 source declarations and reproducible native artifact recipes.
# The NOBILE03 recipe publishes the complete terrain bundle into this Twin's
# .cache. Source projection and sample registration come from standard GeoTIFF
# metadata; site selection and material policy remain authored below.

# NASA SVS CGI Moon Kit / LRO LOLA global elevation, 16 pixels per degree.
# Float32 kilometres relative to 1737.4 km; longitude centered on zero.
# Broad regional relief only: retain the NOBILE03 raster for local contact.
[lola_global_16ppd]
name = "NASA LOLA global lunar elevation — 16 ppd (63 MB)"
url = "https://svs.gsfc.nasa.gov/vis/a000000/a004700/a004720/ldem_16.tif"
dest = "sources/moon/ldem_16.tif"
sha256 = "1ea42bf44f7e9d694f79c3afa7145f97fbf06cc67372067d9fe73dce43bad796"
shared = false
recommended = false

# Native unsigned half-metre LOLA posts, with the NASA +10 km encoding offset.
# Linear preparation preserves every 16-bit sample. No colour/gamma conversion.
[lola_global_displacement_16ppd]
name = "NASA LOLA global displacement, half-metre units (32 MB)"
url = "https://svs.gsfc.nasa.gov/vis/a000000/a004700/a004720/ldem_16_uint.tif"
dest = "sources/moon/ldem_16_uint.tif"
shared = false
recommended = false
[lola_global_displacement_16ppd.process]
kind = "texture"
color_space = "linear"
target_resolution = [5760, 2880]
output = "textures/moon/lola_displacement_16ppd.png"
output_root = "cache"

# Higher detail global LOLA source for regional orbital film shots.
# Source: NASA SVS CGI Moon Kit, 64 ppd unsigned half-metre posts (506 MiB).
# Prepare within the renderer's 16k texture limit while retaining linear 16-bit data.
[lola_global_displacement_64ppd]
name = "NASA LOLA global elevation — 64 ppd source (506 MiB)"
url = "https://svs.gsfc.nasa.gov/vis/a000000/a004700/a004720/ldem_64_uint.tif"
dest = "sources/moon/ldem_64_uint.tif"
sha256 = "0f40bce8b42864deddb6943a38474879e691d5b20647aa5e54c2612b23106499"
shared = false
recommended = false
[lola_global_displacement_64ppd.process]
kind = "texture"
color_space = "linear"
target_resolution = [16384, 8192]
output = "textures/moon/lola_displacement_16k.png"
output_root = "cache"

[nobile03_dem]
name = "LROC NAC DTM NOBILE03 (4 m/pixel polar-stereographic DEM)"
url = "https://pds.lroc.im-ldi.com/data/LRO-L-LROC-5-RDR-V1.0/LROLRC_2001/DATA/SDP/NAC_DTM/NOBILE03/NAC_DTM_NOBILE03.TIF"
dest = "sources/nobile03/NAC_DTM_NOBILE03.TIF"
sha256 = "952f4b898e03fc10e7cdda5ee8e95c8f7c20ba669b7cd5d3e20589d489081f02"
recommended = true

[nobile03_dem.process]
kind = "pipeline"
output = "terrain/nobile03"
output_root = "cache"
center_lat = -84.72672255
center_lon = 29.14428685
window_m = 2048.0
target_resolution = [513, 513]
source_height_offset_m = -5187.322
frame = "MOON_ME"

[nobile03_dem.process.pipeline]
artifacts = [
  { from = "dem", source = "materials/textures/heightmap.tif", path = "materials/textures/heightmap.tif", kind = "dem", dimensions = [513, 513] },
  { from = "albedo", path = "materials/textures/albedo.png", kind = "image", dimensions = [2048, 2048] },
  { from = "coverage", path = "materials/textures/coverage.png", kind = "image", dimensions = [513, 513] },
]

[nobile03_dem.process.pipeline.sources.ortho]
name = "LROC NOBILE03 M1101097181 orthophoto (0.90 m/pixel)"
url = "https://pds.lroc.im-ldi.com/data/LRO-L-LROC-5-RDR-V1.0/LROLRC_2001/EXTRAS/BROWSE/NAC_DTM/NOBILE03/NAC_DTM_NOBILE03_M1101097181_90CM.TIF"
dest = "sources/nobile03/NAC_DTM_NOBILE03_M1101097181_90CM.TIF"
sha256 = "bf825b560c796d8507f9d05f2e646b572b58369ca553d59f407dd305d7d22dbc"

[nobile03_dem.process.pipeline.sources.label]
name = "LROC NAC DTM NOBILE03 source provenance label"
url = "https://pds.lroc.im-ldi.com/data/LRO-L-LROC-5-RDR-V1.0/LROLRC_2001/DATA/SDP/NAC_DTM/NOBILE03/NAC_DTM_NOBILE03.LBL"
dest = "sources/nobile03/NAC_DTM_NOBILE03.LBL"
sha256 = "a208196171bfb777554e8e9ae840339135f99f28d7fe4ce0e3be60f9937e5906"

[[nobile03_dem.process.pipeline.steps]]
id = "dem"
input = "source"
kind = "dem"
output = "dem"

[[nobile03_dem.process.pipeline.steps]]
id = "albedo"
input = "ortho"
kind = "albedo"
output = "albedo.png"
target_resolution = [2048, 2048]
albedo_base_linear = 0.13
albedo_detail_strength = 0.9
albedo_illumination_radius_m = 40.0

[[nobile03_dem.process.pipeline.steps]]
id = "coverage"
input = "source"
kind = "coverage"
output = "coverage.png"

# NASA SVS CGI Moon Kit, December 2025 color revision.
# https://svs.gsfc.nasa.gov/4720/ — credit NASA's Scientific Visualization Studio.
# LROC WAC RGB; high latitudes incorporate LOLA monochromatic albedo.
# Visualization color map, not a new landing-site measurement.
[lroc_moon_2025_8k]
name = "NASA LROC/LOLA Moon color 2025 — 8K sRGB (232 MB source)"
url = "https://svs.gsfc.nasa.gov/vis/a000000/a004700/a004720/lroc_color_16bit_srgb_8k.tif"
dest = "sources/moon/lroc_color_16bit_srgb_8k.tif"
shared = false
recommended = false
sha256 = "db7808e878b6a55eb409bb231eab8deb477f84b5c9d7396d76ff73e5d54992d9"
[lroc_moon_2025_8k.process]
kind = "texture"
target_resolution = [8192, 4096]
output = "textures/moon/lroc_color_2025_8k.png"
output_root = "cache"

