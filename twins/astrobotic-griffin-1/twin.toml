name = "astrobotic-griffin-1"
description = "Astrobotic Griffin-1 surface-operations study Twin"
version = "0.1.0"

[usd]
default_scene = "scenes/griffin_1_surface_ops.usda"
scenes = [
    "scenes/*.usda",
    "tests/*.usda",
]

[sysml]
root = "requirements/griffin_requirements.sysml"
paths = ["requirements"]

[verification]
[[verification.cases]]
name = "Griffin1Requirements::Verify_GriffinRequirements"
scene = "tests/griffin_requirements.usda"
script = "scenarios/tests/griffin_requirements.rhai"
verdict_channel = "GRIFFIN_REQUIREMENTS"

[[verification.cases]]
name = "Griffin1Requirements::Verify_GriffinVisualRequirements"
scene = "tests/griffin_flip_visual.usda"
script = "scenarios/tests/griffin_flip_visual.rhai"
verdict_channel = "GRIFFIN_FLIP_VISUAL"

[[verification.cases]]
name = "FlipRequirements::Verify_FLIPVisualRequirements"
scene = "tests/griffin_flip_visual.usda"
script = "scenarios/tests/griffin_flip_visual.rhai"
verdict_channel = "GRIFFIN_FLIP_VISUAL"

[[verification.cases]]
name = "GriffinRampRequirements::Verify_GriffinRampRequirements"
