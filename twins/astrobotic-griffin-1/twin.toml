name = "astrobotic-griffin-1"
description = "Astrobotic Griffin-1 surface-operations study Twin"
version = "0.1.0"

[usd]
default_scene = "scenes/griffin_1_surface_ops.usda"
scenes = [
    "scenes/*.usda",
    "tests/*.usda",
]

[sysml]
root = "requirements/griffin_requirements.sysml"
paths = ["requirements"]

[verification]
[[verification.cases]]
name = "Griffin1Requirements::Verify_GriffinRequirements"
scene = "tests/griffin_requirements.usda"
script = "scenarios/tests/griffin_requirements.rhai"
verdict_channel = "GRIFFIN_REQUIREMENTS"

[[verification.cases]]
name = "Griffin1Requirements::Verify_GriffinVisualRequirements"
scene = "tests/griffin_flip_visual.usda"
script = "scenarios/tests/griffin_flip_visual.rhai"
verdict_channel = "GRIFFIN_FLIP_VISUAL"

[[verification.cases]]
name = "FlipRequirements::Verify_FLIPVisualRequirements"
scene = "tests/griffin_flip_visual.usda"
script = "scenarios/tests/griffin_flip_visual.rhai"
verdict_channel = "GRIFFIN_FLIP_VISUAL"

[[verification.cases]]
name = "GriffinRampRequirements::Verify_GriffinRampRequirements"
scene = "tests/griffin_ramp_requirements.usda"
script = "scenarios/tests/griffin_ramp_requirements.rhai"
verdict_channel = "GRIFFIN_RAMP_REQUIREMENTS"

[[verification.cases]]
name = "GriffinLanderRequirements::Verify_GriffinLanderRequirements"
scene = "tests/griffin_lander_requirements.usda"
script = "scenarios/tests/griffin_lander_requirements.rhai"
verdict_channel = "GRIFFIN_LANDER_REQUIREMENTS"

[[verification.cases]]
name = "GriffinBusRequirements::Verify_GriffinBusRequirements"
scene = "tests/griffin_bus_requirements.usda"
script = "scenarios/tests/griffin_bus_requirements.rhai"
verdict_channel = "GRIFFIN_BUS_REQUIREMENTS"

[[verification.cases]]
name = "GriffinLandingLegRequirements::Verify_GriffinLandingLegRequirements"
scene = "tests/griffin_landing_legs_requirements.usda"
script = "scenarios/tests/griffin_landing_legs_requirements.rhai"
verdict_channel = "GRIFFIN_LANDING_LEG_REQUIREMENTS"

[[verification.cases]]
name = "GriffinPropulsionRequirements::Verify_GriffinPropulsionRequirements"
scene = "tests/griffin_propulsion_requirements.usda"
script = "scenarios/tests/griffin_propulsion_requirements.rhai"
verdict_channel = "GRIFFIN_PROPULSION_REQUIREMENTS"

[[verification.cases]]
name = "GriffinTankRequirements::Verify_GriffinTankRequirements"
scene = "tests/griffin_tank_requirements.usda"
script = "scenarios/tests/griffin_tank_requirements.rhai"
verdict_channel = "GRIFFIN_TANK_REQUIREMENTS"

[[verification.cases]]
name = "GriffinSolarRequirements::Verify_GriffinSolarRequirements"
scene = "tests/griffin_solar_requirements.usda"
script = "scenarios/tests/griffin_solar_requirements.rhai"
verdict_channel = "GRIFFIN_SOLAR_REQUIREMENTS"

[[verification.cases]]
name = "FlipRequirements::Verify_FLIPComponentRequirements"
scene = "tests/flip_requirements.usda"
script = "scenarios/tests/flip_requirements.rhai"
verdict_channel = "FLIP_REQUIREMENTS"

[[verification.cases]]
name = "FlipChassisRequirements::Verify_FLIPChassisRequirements"
scene = "tests/flip_chassis_requirements.usda"
script = "scenarios/tests/flip_chassis_requirements.rhai"
verdict_channel = "FLIP_CHASSIS_REQUIREMENTS"

[[verification.cases]]
name = "FlipWheelRequirements::Verify_FLIPWheelRequirements"
scene = "tests/flip_wheel_requirements.usda"
script = "scenarios/tests/flip_wheel_requirements.rhai"
verdict_channel = "FLIP_WHEEL_REQUIREMENTS"

[[verification.cases]]
name = "FlipSuspensionRequirements::Verify_FLIPSuspensionRequirements"
scene = "tests/flip_suspension_requirements.usda"
script = "scenarios/tests/flip_suspension_requirements.rhai"
verdict_channel = "FLIP_SUSPENSION_REQUIREMENTS"

[[verification.cases]]
name = "FlipSensorPowerRequirements::Verify_FLIPSensorPowerRequirements"
scene = "tests/flip_sensor_power_requirements.usda"
script = "scenarios/tests/flip_sensor_power_requirements.rhai"
verdict_channel = "FLIP_SENSOR_POWER_REQUIREMENTS"

[[verification.cases]]
name = "Griffin1Requirements::Verify_GriffinSurfaceOperations"
scene = "scenes/griffin_1_surface_ops.usda"
script = "scenarios/griffin_1_surface_ops.rhai"
verdict_channel = "GRIFFIN_SURFACE_OPS"

[[verification.cases]]
name = "Griffin1Requirements::Verify_GriffinLandingStability"
scene = "tests/griffin_surface_ops_contract.usda"
script = "scenarios/tests/griffin_surface_ops_contract.rhai"
verdict_channel = "GRIFFIN_LANDING_STABILITY"

[[verification.cases]]
name = "MoonBaseProjectRequirements::Verify_MoonBaseProjectRequirements"
scene = "tests/griffin_requirements.usda"
script = "scenarios/tests/griffin_requirements.rhai"
verdict_channel = "GRIFFIN_REQUIREMENTS"

# Component ownership is explicit.  Each entry points to one normative SysML
# source and one qualified verification case; the case supplies that
# component's Twin-local USD fixture and Rhai observer above.
[[components]]
name = "griffin.lander"
requirements = "requirements/griffin_lander_requirements.sysml"
verification = "GriffinLanderRequirements::Verify_GriffinLanderRequirements"
usd_path = "/World/Griffin1"

[[components]]
name = "griffin.bus"
requirements = "requirements/griffin_bus_requirements.sysml"
verification = "GriffinBusRequirements::Verify_GriffinBusRequirements"
usd_path = "/World/Griffin1/Bus"

[[components]]
name = "griffin.landing_legs"
requirements = "requirements/griffin_landing_legs_requirements.sysml"
verification = "GriffinLandingLegRequirements::Verify_GriffinLandingLegRequirements"
usd_path = "/World/Griffin1"

[[components]]
name = "griffin.propulsion"
requirements = "requirements/griffin_propulsion_requirements.sysml"
verification = "GriffinPropulsionRequirements::Verify_GriffinPropulsionRequirements"
usd_path = "/World/Griffin1/Nozzle/MainEngineCluster"

[[components]]
name = "griffin.tanks"
requirements = "requirements/griffin_tank_requirements.sysml"
verification = "GriffinTankRequirements::Verify_GriffinTankRequirements"
usd_path = "/World/Griffin1"

[[components]]
name = "griffin.solar"
requirements = "requirements/griffin_solar_requirements.sysml"
verification = "GriffinSolarRequirements::Verify_GriffinSolarRequirements"
usd_path = "/World/Griffin1"

[[components]]
name = "griffin.egress_ramps"
requirements = "requirements/griffin_ramp_requirements.sysml"
verification = "GriffinRampRequirements::Verify_GriffinRampRequirements"
usd_path = "/World/Griffin1"

[[components]]
name = "flip.rover"
requirements = "requirements/flip_requirements.sysml"
verification = "FlipRequirements::Verify_FLIPComponentRequirements"
usd_path = "/World/FLIP"

[[components]]
name = "flip.chassis"
requirements = "requirements/flip_chassis_requirements.sysml"
verification = "FlipChassisRequirements::Verify_FLIPChassisRequirements"
usd_path = "/World/FLIP/Chassis"

[[components]]
name = "flip.directional_wheels"
requirements = "requirements/flip_wheel_requirements.sysml"
verification = "FlipWheelRequirements::Verify_FLIPWheelRequirements"
usd_path = "/World/FLIP"

[[components]]
name = "flip.suspension"
requirements = "requirements/flip_suspension_requirements.sysml"
verification = "FlipSuspensionRequirements::Verify_FLIPSuspensionRequirements"
usd_path = "/FlipSuspension"

[[components]]
name = "flip.sensor_power"
requirements = "requirements/flip_sensor_power_requirements.sysml"
verification = "FlipSensorPowerRequirements::Verify_FLIPSensorPowerRequirements"
usd_path = "/World/FLIP"

[settings]
"usd.runtime_persistence" = true
