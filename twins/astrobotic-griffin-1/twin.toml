# Component ownership is explicit.  Each entry points to one normative SysML
# source and one qualified verification case; the case supplies that
# component's Twin-local USD fixture and Rhai observer above.
[[components]]
name = "griffin.lander"
requirements = "requirements/griffin_lander_requirements.sysml"
verification = "GriffinLanderRequirements::Verify_GriffinLanderRequirements"
usd_path = "/World/Griffin1"

[[components]]
name = "griffin.visual_configuration"
requirements = "requirements/griffin_visual_configuration.sysml"
