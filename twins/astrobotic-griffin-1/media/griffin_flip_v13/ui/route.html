<template>
  <property name="title">Route</property>
  <property name="elapsed">—</property>
  <property name="solar">—</property>
  <property name="used">—</property>
  <property name="balance">—</property>
  <property name="case_color">#ffffff</property>
  <property name="balance_color">#ffffff</property>
  <node id="route-card">
    <node id="route-heading"><text id="route-title">{title}</text><text id="route-time">{elapsed}</text></node>
    <node id="route-values">
      <node id="received"><text id="received-label">Sunlight</text><text id="received-value">{solar}</text></node>
      <node id="used"><text id="used-label">Used</text><text id="used-value">{used}</text></node>
      <node id="balance"><text id="balance-label">Battery</text><text id="balance-value">{balance}</text></node>
    </node>
  </node>
</template>
