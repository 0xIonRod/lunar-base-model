name: Validate lunar news
on:
  pull_request:
    paths:
      - 'research/news/**'
      - 'tools/lunar_news/**'
      - '.github/workflows/*lunar-news.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/lunar_news/requirements.txt
      - run: python -m unittest discover -s tools/lunar_news -p 'test_*.py'
      - run: python tools/lunar_news/validate.py
      - run: python tools/validate_repository.py
