name: Weekly lunar base news
on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: lunar-news-publication
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve pending news and sync main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/automation/lunar-news; then
            git checkout -b automation/lunar-news origin/automation/lunar-news
            git merge origin/main --no-edit
          else
            git checkout -b automation/lunar-news
          fi
      - name: Install validator and test collector
        run: |
          python -m pip install -r tools/lunar_news/requirements.txt
          python -m unittest discover -s tools/lunar_news -p 'test_*.py'
      - name: Collect and validate
        run: |
          python tools/lunar_news/collect.py
          python tools/lunar_news/validate.py
          python tools/validate_repository.py
      - name: Commit evidence and open review PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- research/news
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'news: collect weekly lunar base evidence and proposed actions'
          git push origin HEAD:automation/lunar-news
          existing=$(gh pr list --head automation/lunar-news --base main --state open --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh pr create --base main --head automation/lunar-news --title 'Weekly lunar base news and simulation research actions' --body-file tools/lunar_news/PR_BODY.md
          fi
          echo 'News committed to automation/lunar-news; review PR is ready.' >> "$GITHUB_STEP_SUMMARY"
