name: Package Astrobotic Griffin Twin

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: package-griffin-twin-${{ github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stage Twin sources
        shell: bash
        run: |
          mkdir -p package
          git archive --format=tar --prefix=astrobotic-griffin-1/ \
            HEAD:twins/astrobotic-griffin-1 | tar -xf - -C package \
              --exclude=astrobotic-griffin-1/.lunco/runtime \
              --exclude=astrobotic-griffin-1/.cache

      - name: Create ZIP and checksum
        shell: bash
        run: |
          test -s package/astrobotic-griffin-1/twin.toml
          test -s package/astrobotic-griffin-1/scenes/griffin_1_surface_ops.usda
          test ! -e package/astrobotic-griffin-1/.cache
          printf '%s\n' "$GITHUB_SHA" > package/astrobotic-griffin-1/SOURCE_COMMIT.txt
          cd package
          zip -qr ../astrobotic-griffin-1.zip astrobotic-griffin-1
          cd ..
          unzip -tq astrobotic-griffin-1.zip
          sha256sum astrobotic-griffin-1.zip > astrobotic-griffin-1.zip.sha256

      - name: Publish downloadable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_tag="griffin-twin-main-${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}"
            release_title="Astrobotic Griffin Twin — main @ ${GITHUB_SHA:0:12}"
            latest_flag=(--latest)
          else
            release_tag="griffin-twin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            release_title="Astrobotic Griffin Twin — manual run $GITHUB_RUN_NUMBER"
            latest_flag=(--latest=false)
          fi
          cat > "$RUNNER_TEMP/griffin-release-notes.md" <<EOF
          Download astrobotic-griffin-1.zip and extract the astrobotic-griffin-1 folder.
          Open that folder as a Twin in a compatible LunCoSim installation.

          Includes Griffin/FLIP Twin files: vehicles, scenes, Rhai scripts,
          SysML requirements, and research records.
          LunCoSim supplies the shared lunco:// assets and runtime; it is not included.
          This is a study model, not a flight-validated vehicle or mission.

          Source revision: $GITHUB_SHA
          EOF
          gh release create "$release_tag" \
            astrobotic-griffin-1.zip astrobotic-griffin-1.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes-file "$RUNNER_TEMP/griffin-release-notes.md" "${latest_flag[@]}"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            printf '[Download the latest main build](%s/%s/releases/latest/download/astrobotic-griffin-1.zip)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '[Download this Griffin Twin build](%s/%s/releases/tag/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$release_tag" >> "$GITHUB_STEP_SUMMARY"
          fi
