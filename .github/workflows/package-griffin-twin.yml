name: Package Astrobotic Griffin Twin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Stage Twin sources
        shell: bash
        run: |
          mkdir -p package
          git archive --format=tar --prefix=astrobotic-griffin-1/ \
            HEAD:twins/astrobotic-griffin-1 | tar -xf - -C package \
              --exclude=astrobotic-griffin-1/.lunco/runtime \
              --exclude=astrobotic-griffin-1/.cache
          mkdir -p package/astrobotic-griffin-1/tools/terrain
          cp tools/terrain/README.md tools/terrain/reproject_lroc_polar_dem.py \
            package/astrobotic-griffin-1/tools/terrain/

      - name: Download and verify terrain sources
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import tomllib
          import urllib.request

          twin = Path("package/astrobotic-griffin-1")
          manifest = tomllib.loads((twin / "Assets.toml").read_text())
          sources = Path(os.environ["RUNNER_TEMP"]) / "griffin-terrain"
          sources.mkdir()
          for key in ("nobile03_dem", "nobile03_label"):
              asset = manifest[key]
              target = sources / Path(asset["dest"]).name
              with urllib.request.urlopen(asset["url"], timeout=120) as response:
                  with target.open("wb") as output:
                      shutil.copyfileobj(response, output)
              with target.open("rb") as downloaded:
                  checksum = hashlib.file_digest(downloaded, "sha256").hexdigest()
              if checksum != asset["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch for {key}")
              print(f"Verified {key}: {checksum}")

      - name: Prepare packaged terrain
        shell: bash
        run: |
          python3 package/astrobotic-griffin-1/tools/terrain/reproject_lroc_polar_dem.py \
            --source "$RUNNER_TEMP/griffin-terrain/NAC_DTM_NOBILE03.TIF" \
            --label "$RUNNER_TEMP/griffin-terrain/NAC_DTM_NOBILE03.LBL" \
            --output package/astrobotic-griffin-1/terrain/nobile03/materials/textures/heightmap.tif \
            --center-lat -84.72672255 --center-lon 29.14428685 \
            --window-m 512 --resolution 129 --vertical-offset -5187.322

      - name: Create ZIP and checksum
        shell: bash
        run: |
          test -s package/astrobotic-griffin-1/twin.toml
          test -s package/astrobotic-griffin-1/terrain/nobile03/materials/textures/heightmap.tif
          printf '%s\n' "$GITHUB_SHA" > package/astrobotic-griffin-1/SOURCE_COMMIT.txt
          cd package
          zip -qr ../astrobotic-griffin-1.zip astrobotic-griffin-1
          cd ..
          unzip -tq astrobotic-griffin-1.zip
          sha256sum astrobotic-griffin-1.zip > astrobotic-griffin-1.zip.sha256

      - name: Publish downloadable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="griffin-twin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/griffin-release-notes.md" <<EOF
          Download astrobotic-griffin-1.zip and extract the astrobotic-griffin-1 folder.
          Open that folder as a Twin in a compatible LunCoSim installation.

          Includes Griffin/FLIP vehicles, scenes, Rhai scripts, SysML requirements,
          research records, and the processed NOBILE03 terrain crop.
          LunCoSim supplies the shared lunco:// assets and runtime; it is not included.
          This is a study model, not a flight-validated vehicle or mission.

          Source revision: $GITHUB_SHA
          EOF
          gh release create "$release_tag" \
            astrobotic-griffin-1.zip astrobotic-griffin-1.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Astrobotic Griffin Twin — run $GITHUB_RUN_NUMBER" \
            --notes-file "$RUNNER_TEMP/griffin-release-notes.md" --latest=false
          printf '[Download the Griffin Twin](%s/%s/releases/tag/%s)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$release_tag" >> "$GITHUB_STEP_SUMMARY"
