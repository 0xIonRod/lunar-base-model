aliases:
  - Griffin-1
  - Moon Base II
status: integration_study
mission_class: uncrewed_lunar_south_pole_cargo_lander
operator: Voyager Technologies / Astrobotic / NASA CLPS
purpose: >-
  Maintain a source-backed Griffin-1 landing and FLIP surface-operations
  record while separating public mission facts from the LunCoSim engineering
  proxy used for Modelica and control integration.
target_year: 2026
target_window: late 2026
mission_objectives:
  - deliver Griffin-1 cargo to the lunar South Pole region
  - perform guided powered descent and landing event qualification
  - deploy two prototype side ramps, release the top-deck FLIP adapter after touchdown, and route FLIP to the base site
  - exercise rover mobility, dust mitigation, power, thermal, sensing, and operations contracts
